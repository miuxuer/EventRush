server:
  port: 8081
spring:
  application:
    name: eventrush
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/eventrush?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  rabbitmq:
    # TODO 换成自己虚拟机的 IP 和账号
    host: 192.168.56.101
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    listener:
      simple:
        # 一个消费者一次只取一条，手动 ACK 保证消息不丢
        prefetch: 1
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.miuxuer.eventrush.entity # 别名扫描包
logging:
  level:
    com.miuxuer.eventrush: debug
